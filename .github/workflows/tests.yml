name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install "numpy>=2.0" scipy pytest
      - name: Test
        run: pytest tests -q -m "not slow"

  qiskit:
    # The engine is checked against Qiskit's own QAOA circuit on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install "numpy>=2.0" scipy pytest "qiskit>=2.0"
      - name: Test (qiskit)
        run: pytest tests -q -m slow -rs
